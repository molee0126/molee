name: face_ai
description: FaceAI 消费者自拍面部美学采集，本地优先。
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.1
  path_provider: ^2.1.5
  google_mlkit_face_detection: ^0.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

